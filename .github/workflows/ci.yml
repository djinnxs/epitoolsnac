name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Instala EXACTAMENTE lo que instala streamlit.io (mismo requirements.txt)
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Compilar todo el código
        run: python -m compileall -q Home.py pages utils etl_semanal.py

      - name: Tests
        run: pytest -q

      - name: Verificar que el servidor arranca
        run: |
          streamlit run Home.py --server.port 8501 --server.headless true --browser.gatherUsageStats false &
          sleep 20
          curl -fsS http://localhost:8501/_stcore/health
